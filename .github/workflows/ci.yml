name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  spec:
    name: Spec checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cheap, no toolchain, and catches a class of defect careful reading does
      # not — see §13.3. Runs first so a broken reference is reported even when
      # the build is red.
      - name: Section citations resolve
        run: ./tools/check-citations.sh

      - name: Stated counts match their lists
        run: ./tools/check-counts.sh

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # There is no solution file, so every command names its project.
      - name: Build
        run: dotnet build src/ClaudeTuiLine/ClaudeTuiLine.csproj -c Release

      - name: Test
        run: dotnet test tests/ClaudeTuiLine.Tests/ClaudeTuiLine.Tests.csproj -c Release

      # The third doc check, and the only one that is not closed-world: it runs the binary
      # and compares its rendered examples against what the documentation claims they are.
      # It lives here rather than in the `spec` job because it needs the toolchain — which
      # is the whole point of it, and the reason the other two cannot catch what it catches
      # (§9.6.2.2, §13.3). It runs after the tests so a red suite is reported as a red
      # suite, not as documentation drift.
      - name: Documented examples match the binary
        run: ./tools/check-examples.sh
